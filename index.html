<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>智能安防 · 蓝牙监控助手</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    :root {
      --bg: #1a1a24; --card: #242430; --accent-red: #e74c3c; --accent-green: #2ecc71;
      --accent-yellow: #f39c12; --text: #f0f0f5; --text2: #a0a0b0; --border: #3a3a4a; --bar-bg: #2e2e3a;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: 'Inter', sans-serif; background: radial-gradient(circle at 30% 20%, #2a1e2e, #16121c); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; }
    .phone { max-width:420px; width:100%; background:var(--bg); border-radius:44px; padding:18px 16px 24px; box-shadow:0 20px 45px rgba(0,0,0,0.7); border:1px solid #4a3e5a; color:var(--text); }
    .status-bar { display:flex; justify-content:space-between; align-items:center; background:#25243a; border-radius:30px; padding:8px 16px; margin-bottom:16px; font-weight:500; font-size:0.8rem; }
    .bt-area { display:flex; align-items:center; gap:8px; }
    .led { width:11px; height:11px; background:#5a5a7a; border-radius:50%; }
    .led.active { background:#2ecc71; box-shadow:0 0 14px #2ecc71; animation:pulse 1.5s infinite; }
    @keyframes pulse { 0%,100%{opacity:0.6;transform:scale(1);} 50%{opacity:1;transform:scale(1.15);} }
    .clock { font-family:monospace; font-weight:600; }
    .btn {
      background:#3a3a50; border:none; padding:8px 14px; border-radius:2rem; font-weight:600; font-size:0.7rem; color:#fff;
      cursor:pointer; display:inline-flex; align-items:center; gap:5px; border:1px solid #5a5a76; transition:0.15s; white-space:nowrap;
      user-select: none;
    }
    .btn:active { transform:scale(0.95); background:#52526a; }
    .btn-danger { background:#a03a2a; border-color:#c04a3a; }
    .btn-send { background:#1a5c3a; border-color:#2e8b5a; }
    .config-panel { display:none; background:#25243a; border-radius:18px; padding:12px; margin-bottom:14px; border:1px solid #4a3e5a; flex-direction:column; gap:8px; }
    .config-panel input { background:#1a1a24; border:1px solid #4a3e5a; color:#fff; padding:6px 10px; border-radius:16px; font-family:monospace; font-size:0.65rem; flex:1; outline:none; }
    .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }

    .sensor-card { background:var(--card); border-radius:22px; padding:14px; margin-bottom:14px; border:1px solid var(--border); display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .vib-value { font-size:2.4rem; font-weight:800; color:#f5b042; }
    .vib-bar-bg { width:100%; height:10px; background:var(--bar-bg); border-radius:8px; margin:8px 0; overflow:hidden; }
    .vib-bar-fill { height:100%; width:0%; background:linear-gradient(90deg,#f1c40f,#e67e22,#e74c3c); border-radius:8px; transition:width 0.3s; }
    .ir-led { width:40px; height:40px; border-radius:50%; background:#3a3a4a; box-shadow:0 0 10px transparent; transition:0.3s; }
    .ir-led.active { background:#e74c3c; box-shadow:0 0 20px #e74c3c,0 0 40px rgba(231,76,60,0.6); }
    .ir-label { margin-top:6px; font-size:0.7rem; color:var(--text2); }

    .threshold-panel { background:var(--card); border-radius:18px; padding:12px; margin-bottom:14px; border:1px solid var(--border); display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
    .threshold-input { width:70px; background:#1a1a24; border:1px solid #4a3e5a; color:#fff; padding:6px; border-radius:12px; text-align:center; font-weight:600; }

    .cmd-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px; }
    .cmd-btn {
      background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 12px;
      font-size: 0.8rem; font-weight: 700; color: var(--text); cursor: pointer; display: flex;
      flex-direction: column; align-items: center; gap: 6px; position: relative; transition: 0.15s;
    }
    .cmd-btn:active { background: #3a3a5a; transform: scale(0.96); }
    .cmd-btn .cmd-letter { font-size: 1.2rem; color: var(--accent-yellow); }
    .cmd-btn .edit-icon {
      position: absolute; top: 8px; right: 8px; font-size: 0.6rem; color: var(--text2); cursor: pointer; opacity: 0.5;
    }
    .cmd-btn .edit-icon:hover { opacity: 1; }

    .log-box { background:#12121e; border-radius:16px; padding:10px; height:110px; overflow-y:auto; font-family:monospace; font-size:0.65rem; color:#b0b0c0; border:1px solid #2e2e42; margin-top:10px; }

    .alert-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); display:none; align-items:center; justify-content:center; z-index:100; backdrop-filter:blur(6px); }
    .alert-box { background:#2c1e1e; border:2px solid #e74c3c; border-radius:24px; padding:20px; text-align:center; max-width:300px; color:#fff; box-shadow:0 0 30px rgba(231,76,60,0.8); animation:shakeAlert 0.5s; }
    @keyframes shakeAlert { 0%,100%{transform:translate(0);} 25%{transform:translate(-5px,0);} 75%{transform:translate(5px,0);} }
    .alert-box button { margin-top:12px; }
  </style>
</head>
<body>
<div class="phone">
  <div class="status-bar">
    <div class="bt-area">
      <div class="led" id="bleLed"></div>
      <span id="connStatus">未连接</span>
      <button class="btn" id="configToggleBtn"><i class="fas fa-cog"></i></button>
    </div>
    <div class="clock" id="liveClock">--:--:--</div>
  </div>

  <div class="config-panel" id="configPanel">
    <div class="row">
      <input id="serviceUuid" value="0000fff0-0000-1000-8000-00805f9b34fb" placeholder="服务UUID">
      <input id="notifyUuid" value="0000fff1-0000-1000-8000-00805f9b34fb" placeholder="通知UUID">
      <input id="writeUuid" value="0000fff1-0000-1000-8000-00805f9b34fb" placeholder="写入UUID">
    </div>
    <div class="row">
      <button class="btn" id="scanBtn">扫描</button>
      <button class="btn" id="connectBtn" disabled>连接</button>
      <button class="btn btn-danger" id="disconnectBtn" disabled>断开</button>
      <button class="btn" id="simulateBtn"><i class="fas fa-random"></i> 模拟数据</button>
    </div>
  </div>

  <div class="sensor-card">
    <div class="vibration-box">
      <span style="font-size:0.7rem; color:var(--text2);">📳 震动量</span>
      <span class="vib-value" id="vibrationVal">0.0</span>
      <div class="vib-bar-bg"><div class="vib-bar-fill" id="vibBar" style="width:0%"></div></div>
    </div>
    <div class="ir-box">
      <div class="ir-led" id="irLed"></div>
      <span class="ir-label" id="irLabel">红外：未触发</span>
    </div>
  </div>

  <div class="threshold-panel">
    <span style="font-weight:600; font-size:0.8rem;">⚙️ 震动阈值</span>
    <input type="number" id="thresholdInput" class="threshold-input" value="5.0" step="0.1" min="0">
    <span style="font-size:0.65rem; color:var(--text2);">超过时报警</span>
    <button class="btn" id="testAlertBtn"><i class="fas fa-bell"></i> 测试震动报警</button>
  </div>

  <!-- 自定义按键下发区 -->
  <div style="margin-bottom:14px;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
      <span style="font-weight:600; font-size:0.8rem;">🎛️ 快捷指令 (点击发送对应字母)</span>
      <button class="btn" id="resetCmdBtn" style="font-size:0.6rem;"><i class="fas fa-undo"></i> 重置默认</button>
    </div>
    <div class="cmd-grid" id="cmdGrid"></div>
  </div>

  <div class="log-box" id="logBox"><div>🔔 智能安防助手就绪</div></div>
</div>

<!-- 震动超标弹窗 -->
<div class="alert-overlay" id="vibrationAlert">
  <div class="alert-box">
    <div style="font-size:2rem;">📳</div>
    <div style="font-weight:800; font-size:1.2rem; margin:8px 0;" id="vibAlertTitle">震动超标！</div>
    <div id="vibAlertMsg" style="font-size:0.8rem;">请检查现场情况</div>
    <button class="btn btn-danger" id="closeVibAlertBtn">确认并关闭</button>
  </div>
</div>

<!-- 红外触发弹窗 -->
<div class="alert-overlay" id="irAlert">
  <div class="alert-box">
    <div style="font-size:2rem;">🚶</div>
    <div style="font-weight:800; font-size:1.2rem; margin:8px 0;">有人靠近！</div>
    <div id="irAlertMsg" style="font-size:0.8rem;">红外传感器被触发，请检查</div>
    <button class="btn btn-danger" id="closeIrAlertBtn">确认并关闭</button>
  </div>
</div>

<script>
  (() => {
    // DOM
    const bleLed = document.getElementById('bleLed');
    const connStatus = document.getElementById('connStatus');
    const configToggleBtn = document.getElementById('configToggleBtn');
    const configPanel = document.getElementById('configPanel');
    const scanBtn = document.getElementById('scanBtn');
    const connectBtn = document.getElementById('connectBtn');
    const disconnectBtn = document.getElementById('disconnectBtn');
    const simulateBtn = document.getElementById('simulateBtn');
    const serviceUuidInput = document.getElementById('serviceUuid');
    const notifyUuidInput = document.getElementById('notifyUuid');
    const writeUuidInput = document.getElementById('writeUuid');
    const vibrationValSpan = document.getElementById('vibrationVal');
    const vibBar = document.getElementById('vibBar');
    const irLed = document.getElementById('irLed');
    const irLabel = document.getElementById('irLabel');
    const thresholdInput = document.getElementById('thresholdInput');
    const testAlertBtn = document.getElementById('testAlertBtn');
    const logBox = document.getElementById('logBox');
    const clockSpan = document.getElementById('liveClock');
    const vibrationAlert = document.getElementById('vibrationAlert');
    const vibAlertMsg = document.getElementById('vibAlertMsg');
    const closeVibAlertBtn = document.getElementById('closeVibAlertBtn');
    const irAlert = document.getElementById('irAlert');
    const closeIrAlertBtn = document.getElementById('closeIrAlertBtn');
    const cmdGrid = document.getElementById('cmdGrid');
    const resetCmdBtn = document.getElementById('resetCmdBtn');

    let bluetoothDevice = null, gattServer = null, notifyChar = null, writeChar = null, isConnected = false;
    let lastIrState = 0; // 记录上次红外状态，用于边缘触发
    let cmdNames = ['A','B','C','D','E','F']; // 默认按键名

    // 加载自定义按键名
    function loadCmdNames() {
      try {
        const saved = localStorage.getItem('security_cmds');
        if (saved) cmdNames = JSON.parse(saved);
        else cmdNames = ['命令A','命令B','命令C','命令D','命令E','命令F'];
      } catch { cmdNames = ['A','B','C','D','E','F']; }
      renderCmdButtons();
    }
    function saveCmdNames() {
      localStorage.setItem('security_cmds', JSON.stringify(cmdNames));
    }
    function renderCmdButtons() {
      cmdGrid.innerHTML = '';
      const letters = ['A','B','C','D','E','F'];
      letters.forEach((letter, i) => {
        const btn = document.createElement('div');
        btn.className = 'cmd-btn';
        btn.innerHTML = `
          <span class="cmd-letter">${letter}</span>
          <span class="cmd-name" id="cmdName${i}">${cmdNames[i]}</span>
          <i class="fas fa-pencil-alt edit-icon" data-index="${i}"></i>
        `;
        btn.addEventListener('click', (e) => {
          if (e.target.classList.contains('edit-icon') || e.target.closest('.edit-icon')) return;
          sendCommand(letter);
        });
        const editIcon = btn.querySelector('.edit-icon');
        editIcon.addEventListener('click', (e) => {
          e.stopPropagation();
          const newName = prompt(`修改按键 ${letter} 的名称：`, cmdNames[i]);
          if (newName !== null && newName.trim() !== '') {
            cmdNames[i] = newName.trim();
            saveCmdNames();
            document.getElementById(`cmdName${i}`).textContent = cmdNames[i];
          }
        });
        cmdGrid.appendChild(btn);
      });
    }
    resetCmdBtn.addEventListener('click', () => {
      if (confirm('重置所有按键名称为默认？')) {
        cmdNames = ['命令A','命令B','命令C','命令D','命令E','命令F'];
        saveCmdNames();
        renderCmdButtons();
        addLog('按键名称已重置');
      }
    });

    // 时钟
    function updateClock() { clockSpan.textContent = new Date().toLocaleTimeString('zh-CN',{hour12:false}); }
    setInterval(updateClock, 1000); updateClock();

    function addLog(msg, type='info') {
      const d = document.createElement('div');
      d.style.color = type==='rx'?'#2ecc71': type==='tx'?'#3498db':'#b0b0c0';
      d.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      logBox.appendChild(d); logBox.scrollTop = logBox.scrollHeight;
      if(logBox.children.length > 30) logBox.removeChild(logBox.children[0]);
    }

    function updateConnectionUI(c) {
      isConnected = c;
      bleLed.classList.toggle('active', c);
      connStatus.textContent = c?'已连接':'未连接';
      connectBtn.disabled = c||!bluetoothDevice; disconnectBtn.disabled = !c; scanBtn.disabled = c;
    }

    // 发送单个字母
    async function sendCommand(letter) {
      if (!isConnected || !writeChar) { addLog('未连接', 'tx'); return; }
      try {
        await writeChar.writeValue(new TextEncoder().encode(letter));
        addLog(`📤 发送指令: ${letter} (${cmdNames[letter.charCodeAt(0)-65]})`, 'tx');
      } catch(e) { addLog(`发送失败: ${e.message}`, 'tx'); }
    }

    // 传感器更新
    function updateSensors(vibration, ir) {
      vibrationValSpan.textContent = vibration.toFixed(1);
      vibBar.style.width = Math.min(100, Math.max(0, (vibration/20)*100))+'%';
      // 红外状态更新
      if (ir === 1) {
        irLed.classList.add('active');
        irLabel.textContent = '红外：已触发';
        irLabel.style.color = '#e74c3c';
        if (lastIrState === 0) { // 触发边缘
          triggerIrAlert();
        }
      } else {
        irLed.classList.remove('active');
        irLabel.textContent = '红外：未触发';
        irLabel.style.color = '#a0a0b0';
      }
      lastIrState = ir;
      // 震动阈值检查
      const thresh = parseFloat(thresholdInput.value) || 5.0;
      if (vibration > thresh) {
        triggerVibrationAlert(vibration, thresh);
      }
    }

    function triggerVibrationAlert(v, t) {
      if (vibrationAlert.style.display === 'flex') return;
      vibrationAlert.style.display = 'flex';
      vibAlertMsg.textContent = `当前震动 ${v.toFixed(1)} > 阈值 ${t.toFixed(1)}，请立即检查。`;
      speak('警告，震动超标');
      addLog(`📳 震动报警: ${v.toFixed(1)} > ${t}`, 'rx');
    }
    function triggerIrAlert() {
      if (irAlert.style.display === 'flex') return;
      irAlert.style.display = 'flex';
      speak('有人靠近');
      addLog('🚶 红外报警：有人靠近', 'rx');
    }

    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'zh-CN'; u.rate = 1.0;
        window.speechSynthesis.speak(u);
      }
    }

    closeVibAlertBtn.onclick = ()=>{ vibrationAlert.style.display='none'; speechSynthesis.cancel(); };
    closeIrAlertBtn.onclick = ()=>{ irAlert.style.display='none'; speechSynthesis.cancel(); };
    testAlertBtn.onclick = ()=> triggerVibrationAlert(6, +thresholdInput.value||5);

    function parseSensorData(raw) {
      const m = raw.match(/#([\d.]+)#(\d)#/);
      if (m) {
        updateSensors(+m[1], +m[2]);
        addLog(`📥 震动:${m[1]} 红外:${m[2]}`, 'rx');
        return true;
      }
      return false;
    }

    function onNotification(e) {
      const v = e.target.value; if(!v) return;
      parseSensorData(new TextDecoder('utf-8').decode(v).trim());
    }

    // 蓝牙操作
    async function scan() {
      if (!navigator.bluetooth) { alert('需要 Web Bluetooth'); return; }
      const svc = serviceUuidInput.value.trim(); if (!svc) return alert('输入UUID');
      try {
        const device = await navigator.bluetooth.requestDevice({
          filters: [{ services: [svc] }], optionalServices: [svc]
        });
        bluetoothDevice = device; connectBtn.disabled = false;
        addLog(`已选择: ${device.name || device.id}`);
      } catch(e) { if(!e.message.includes('cancelled')) addLog(`扫描错误: ${e.message}`); }
    }

    async function connect() {
      if (!bluetoothDevice) return;
      const svc = serviceUuidInput.value.trim(), ntf = notifyUuidInput.value.trim(), wrt = writeUuidInput.value.trim();
      try {
        gattServer = await bluetoothDevice.gatt.connect();
        const service = await gattServer.getPrimaryService(svc);
        notifyChar = await service.getCharacteristic(ntf);
        await notifyChar.startNotifications();
        notifyChar.addEventListener('characteristicvaluechanged', onNotification);
        if (wrt) { try { writeChar = await service.getCharacteristic(wrt); } catch(e) {} }
        updateConnectionUI(true);
        bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnect);
        addLog('✅ 蓝牙已连接');
      } catch(e) { addLog(`连接失败: ${e.message}`); updateConnectionUI(false); }
    }

    function onDisconnect() {
      addLog('设备断开');
      if (notifyChar) notifyChar.removeEventListener('characteristicvaluechanged', onNotification);
      notifyChar = writeChar = null;
      updateConnectionUI(false);
    }

    function disconnect() {
      if (bluetoothDevice && bluetoothDevice.gatt.connected) bluetoothDevice.gatt.disconnect();
      else onDisconnect();
    }

    function simulateData() {
      const vibration = (Math.random() * 8).toFixed(1);
      const ir = Math.random() < 0.4 ? 1 : 0;
      parseSensorData(`#${vibration}#${ir}#`);
    }

    configToggleBtn.onclick = () => configPanel.style.display = configPanel.style.display === 'none' ? 'flex' : 'none';
    scanBtn.onclick = scan;
    connectBtn.onclick = connect;
    disconnectBtn.onclick = disconnect;
    simulateBtn.onclick = simulateData;

    // 初始化
    loadCmdNames();
    updateConnectionUI(false);
    updateSensors(0, 0);
    addLog('智能安防就绪 | 红外触发播报“有人靠近”');
  })();
</script>
</body>
</html>
